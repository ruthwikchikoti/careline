[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careline"
version = "0.0.1"
description = "CareLine — post-consultation multi-agent AI voice agent (LangGraph) with a deterministic safety spine."
requires-python = ">=3.11"
authors = [{ name = "CareLine Team" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    # The HTTP API is part of the deployable app (Vercel installs only these core
    # dependencies), so FastAPI and PyJWT are core, not extras.
    "fastapi>=0.111",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
# Live LLM / infra extras are added slice-by-slice per the build plan
# (langgraph, motor, fastapi, anthropic, openai, langsmith). The M0 brain
# runs fully offline/keyless and needs only pydantic.
auth = [
    "PyJWT>=2.8",
]
# Live reasoning backends (optional). The default spine runs on the keyless
# heuristic twins; install this extra + set OPENAI_API_KEY (or ANTHROPIC_API_KEY)
# to run on a real LLM.
llm = [
    "openai>=1.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]
# Layer-1 MongoDB persistence (optional). Set CARELINE_MONGO_URI to enable;
# omit it to run fully in-memory. dnspython is needed for mongodb+srv:// URIs.
data = [
    "motor>=3.4",
    "dnspython>=2.4",
]
# Observability (optional): Langfuse per-turn traces. Set
# CARELINE_LANGFUSE_PUBLIC_KEY / CARELINE_LANGFUSE_SECRET_KEY (and optionally
# CARELINE_LANGFUSE_HOST) to enable; without keys the tracer is a no-op.
obs = [
    "langfuse>=2,<4",  # tracer targets the v2/v3 APIs; v4 dropped start_generation
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
]
dev = [
    "pytest>=8.0",
    "PyJWT>=2.8",
    "httpx2>=2.4",
    "fastapi>=0.111",
    # In-memory async Mongo for tests/data — without it the whole Mongo-backed
    # data suite is skipped at import and CI silently tests nothing there.
    "mongomock-motor>=0.0.29",
]

[tool.vercel]
# Vercel Python runtime: module-level ASGI app (careline/api/vercel_app.py).
entrypoint = "careline.api.vercel_app:app"

[tool.setuptools.packages.find]
include = ["careline*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
