  danger_concept_invariant: 'gates/chain.py: before ANSWER, every net runs with ALL context guards off
    (symptom_report.mentions_danger_concept), then the v6 body-state backstop; any hit -> CLARIFY + emergency
    line (ESCALATE when the clarify budget is spent). Every scope; Brain and graph alike.'
  anaphoric_present:
    note: 'v6: a live clause carrying one of these markers (''I have it now'', ''it''s back'') restores
      the immediately preceding suppressed (history / hypothetical) clause to the live text.'
    markers:
    - \b(?:i|we|he|she|they)\s+(?:have|has|'?ve\s+got|got|feel|am\s+having|is\s+having|are\s+having)\s+(?:it|that|this|those|them|the\s+same(?:\s+(?:thing|pain|symptoms?))?)\b
    - \b(?:i'?m|he'?s|she'?s|they'?re|we'?re)\s+(?:having|getting|feeling)\s+(?:it|that|this|those|them|the\s+same)\b
    - \b(?:it'?s|it\s+is|it\s+has|that'?s|that\s+is|this\s+is|the\s+same\s+thing(?:'s|\s+is)?)\s+(?:back|come\s+back|happening(?:\s+(?:again|now|to\s+me))?|starting\s+again|started\s+again)\b
  body_state_backstop:
    note: 'v6 LLM-path backstop (symptom_report.mentions_present_body_report): a clause with a subject
      (caller, care recipient, Hinglish ''<x> ko'', or since/ago onset) AND a present / progressive /
      recent-onset structure AND a broad body-state word, not conditional (''if'', ''unless'', ''in case'')
      or improving (''getting better'') and not mild-qualified, blocks ANSWER in the gate chain''s final
      invariant (CLARIFY + 112 line; ESCALATE once the clarify budget is spent). It never escalates on
      its own.'
    vocabulary: \b(?:pain\w*|hurt\w*|ach(?:e|es|ing|y)|\w+aches?|sore\w*|bleed\w*|breath\w*|saa?ns|blood(?!\s*-?\s*(?:pressure|sugars?|tests?|reports?|counts?|levels?|readings?|results?|group|work|glucose|thinners?)\b)|dard|taklif|takleef|dikkat|ajeeb|ghabrahat|cramp\w*|spasm\w*|swell\w*|swollen|numb(?!er)\w*|tingl\w*|dizz\w*|faint\w*|vomit\w*|nause\w*|sick|unwell|fever\w*|temperature|chills?|shiver\w*|shak(?:y|ing)|trembl\w*|weak\w*|exhaust\w*|drows\w*|sleepy|confus\w*|itch\w*|rash\w*|cough\w*|wheez\w*|discharge|leak\w*|ooz\w*|pus|lumps?|bruis\w*|fits?|seiz\w*|jerk\w*|palpitat\w*|flutter\w*|racing|pounding|throbb\w*|burn(?:s|ing)|sting(?:s|ing)|stiff\w*|spotting|neel[aeiy]|blue|purple|pale|grey|gray|clammy|sweat\w*|ringing|buzzing|bloat\w*|diarr?h\w*|loose\s+motions?|constipat\w*|ulti|khoon|chakkar|bukhar|strange|weird|funny|odd)\b
    present_patterns:
    - \b(?:right\s+)?now\b|\btoday\b|\btonight\b|\bcurrently\b|\bat\s+the\s+moment\b|\babhi\b
    - \bsince\b|\bago\b|\bthis\s+(?:morning|afternoon|evening)\b|\bjust\s+(?:now|started|began)\b
    - \b(?:i|we)\s+(?:have|feel|keep)\b(?!\s+(?:had\b|been\b|a\s+question|no\b|never\b))|\bi'?ve\s+got\b
    - \b(?:is|are|am|'s|'re|'m|keeps?|kept|been|started|starting)\s+(?:\w+\s+){0,2}?\w+ing\b
    - \b(?:has|have|'s|is|are)\s+(?:gone|turned|become|got(?:ten)?|started)\b
    - \b(?:ho|kar|aa|lag)\s+(?:rah[aie]|rahe)\b|\b(?:pad|ho)\s+(?:gay[aie]|gaye)\b
    conditional: \b(?:if|unless|in\s+case)\b|\b(?:getting|got|feeling|feel|much|a\s+lot)\s+better\b|\bimproving\b
  citation_veto: 'v6, gates/chain.py run_gate_chain: an ANSWER may cite only ids that are EXACTLY (case-sensitive)
    ids of the current valid slice, each at most once; otherwise CLARIFY + emergency line, or ESCALATE
    when a danger concept is present or the clarify budget is spent. Shared by the Brain and the graph.'
typo_normalisation:
  method: 'optimal-string-alignment distance; tokens >= 5 letters snap to a canonical token at distance
    <= 1 (<= 2 for canonical tokens >= 10 letters); rails scan the original AND the normalised text; v6:
    rails also scan a de-obfuscated variant and its typo-normalised form'
  canonical_tokens:
  - unconscious
  - unresponsive
  - seizure
  - seizures
  - convulsion
  - convulsions
  - suicidal
  - suicide
  - overdose
  - overdosed
  - anaphylaxis
  - anaphylactic
  - breathe
  - breathing
  - bleeding
  - vomiting
  bigrams:
    chest: pain
    heart: attack
  joined_compounds:
  - chestpain
  - heartpain
  - chestattack
  - heartattack
  fuzzy_pairs:
  - - heart
    - attack
  - - chest
    - pain
  - - passed
    - out
  deobfuscation:
    separated_runs: '>= 3 single letters (or apostrophes) joined by one of ''-'', ''.'', ''_'', ''*''
      are collapsed'
    spaced_runs: '>= 3 single letters joined by single spaces are collapsed (a leading capital ''I'' before
      a lower-case letter is kept as the pronoun; 2+ spaces mark word breaks)'
    leet_map:
      '3': e
      '@': a
      '0': o
      '1': i
      $: s
    leet_scope: inside tokens with >= 3 letters, no digit outside the map, and not mixed-case (HbA1c,
      SpO2 untouched)
redirect_emergency_line: If this is an emergency, call 112 (India) or your local emergency number now.
red_flag_escalation_emergency_line: 'v6: every ESCALATE with scope red_flag (triage rail, acute net, symptom
  report, scope-gate re-checks), every cross-condition escalation and the danger-invariant escalation
  carry the redirect_emergency_line.'
