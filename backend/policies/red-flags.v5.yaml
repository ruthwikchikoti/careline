  - unresponsive
  - seizure
  - seizures
  - convulsion
  - convulsions
  - suicidal
  - suicide
  - overdose
  - overdosed
  - anaphylaxis
  - anaphylactic
  - breathe
  - breathing
  - bleeding
  - vomiting
  bigrams:
    chest: pain
    heart: attack
  joined_compounds:
