version: v5
description: 'Emergency rail policy. v5 = v4 + blind-battery-1 fixes (2026-10-08). A blind battery (40
  emergencies + 40 benign, written by an agent that had never seen the code) measured v4 at 34/40 recall
  and 4/40 false escalations; those ten items DROVE v5 and are DEV data from here on (tests/brain/test_blind1_battery.py;
  eval em-113..118, oos-056..059), not generalisation evidence. Mechanisms: (a) intent-to-overdose / stockpiling
  ideation families (saving up / hoarding / stockpiling pills, take them all / the whole strip, tonight
  is the night, don''t see the point anymore), matched on the denial-stripped text; (b) a TAKEN overdose
  quantity (>= 8 or a number word) with a medicine noun (generic, Indian brand, or drug-suffix family;
  units excluded) is a literal pattern on the whole message, so no denial elsewhere suppresses it; (c)
  Indian-English progressive pain verbs (chest is paining, paining a lot) and an implicit body-part subject
  in the symptom-report layer; (d) Hinglish limb/speech/face deficits (haath/pair kaam nahi kar raha,
  sun/sunn, bol nahi pa rahi, chehra tedha, ek side, achanak, lakwa) and chest/seene/dil mein ... dard
  with up to three intervening tokens; (e) child + insulin pen/syringe/injection, third-person self-injection,
  someone else''s medicine, insulin + hypoglycaemia signs; (f) precision: third-party/media framing is
  stripped as a SPAN (never a whole clause; a following ''and since then my chest hurts'' stays live),
  transient-and-resolved framing suppresses only the mild labels (dizzy, fever, dizziness) never a red
  flag, and ''donate/give blood'' is not bleeding. The danger-concept invariant is unchanged: a suppressed
  danger concept is still never ANSWERED.'
