version: v3
description: 'Emergency rail policy. v3 = v2 semantic layer + red-team hardening: context suppression
  (history/denial markers), acute-concern fail-closed layer before any out-of-scope redirect, literal
  patterns for inflections and number crises, 1-char token fix. Derived from the adversarial review of
  2026-10-07 (tests/brain/test_red_flag_novel.py).'
patterns:
- chest\s+pain
- difficulty\s+breathing
- breathing\s+difficulty
- can'?t\s+breathe
- shortness\s+of\s+breath
- unconscious
- unresponsive
- seizure
- convulsion
- bleeding\s+heavily
- heavy\s+bleeding
- suicid
- self[- ]?harm
- heart\s+attack
- stroke\s+symptom
- anaphyla
- choking
- overdose
- poison
- severe\s+allergic
- head\s+injury
- loss\s+of\s+consciousness
- cannot\s+breathe
- can\s+not\s+breathe
- shortness[\s-]+of[\s-]+breath
- breathless\s+(?:at|while|when)\s+(?:rest|lying|sitting|speaking|talking|walking|climbing)
- black\s+like\s+tar
- black\s+(?:tarry\s+)?stool
- coffee[\s-]ground
- (?:sugar|glucose)\s+(?:has\s+|keeps\s+|is\s+|was\s+)?(?:dropped|dropping|low)\b
- (?:sugar|glucose)\b[^.]{0,30}\b(?:[23]\d|4\d)\b(?!\d)
- \b(?:1[7-9]\d|2\d\d)\s*(?:over|/)\s*1[0-4]\d\b
- ketone\w*\s*(?:strips?|test|levels?)?\s*(?:is|are|show\w*|reading)?\s*high
- nail\s+polish\s+remover
- fruity\s+breath
- (?:drank|drinking|swallowed|swallowing|ate|eaten|got\s+into)\b[^.]{0,40}\b(?:kerosene|bleach|pesticide|weed\s?-?killer|cleaning\s+liquid|detergent|camphor|naphthalene|petrol)\b
- (?:cannot|could\s?not|won'?t)\s+be\s+woken
- not\s+responding
- \bslurr(?:ed|ing)\b
- bleeding\s+(?:through|past|soaking)\s+(?:the\s+)?(?:bandage|dressing)
- \btook\b[^.]{0,40}(?:instead\s+of\s+(?:my|mine)|by\s+mistake|wrong\s+(?:tablet|medicine|dose|bottle))
- (?:turned|turning)\s+(?:blue|bluish|grey|gray)
pattern_concepts:
  heart\s+attack: cardiac_signs
  stroke\s+symptom: stroke
  head\s+injury: head_injury
  chest\s+pain: chest_pain_cardiac
  seizure: seizure
  convulsion: seizure
  unconscious: reduced_consciousness
  unresponsive: reduced_consciousness
  loss\s+of\s+consciousness: reduced_consciousness
  suicid: suicid
  self[- ]?harm: self_harm
semantic:
  threshold: 0.55
  score: 0.6*token_coverage + 0.4*char_trigram_cosine
  phrases:
    suicidal_ideation:
    - I want to end my life
    - I don't want to be alive anymore
    - I don't think I want to live anymore
    - I am going to kill myself
    - I feel like hurting myself
    - I want to harm myself
    - everyone would be better off without me
    - taking all my tablets and not waking up
    - I have thoughts of ending things
    - I don't feel safe with myself tonight
    overdose:
    - I took too many tablets at once
    - I took 20 tablets at once
    - I took too many of my pain pills
    - I took too many tablets today
    - took an entire strip of tablets
    - I had a double dose of my tablets by mistake
    - took my tablet twice by accident
    - I accidentally took two doses
    - I accidentally took an extra dose of my medicine
    - I overdosed on my medication
    - my child ate some of my tablets
    - my child got into my tablet strip
    - swallowed a whole bottle of pills
    poisoning:
    - I drank cleaning liquid by mistake
    - I swallowed something poisonous
    - I accidentally drank a chemical
    - my child swallowed something from the cupboard
    - I drank the weed killer
    chest_pain_cardiac:
    - crushing pain in my chest
    - tightness in my chest
    - pressure on my chest
    - my chest feels like an elephant is sitting on it
    - a band is squeezing my chest
    - chest is tight and squeezing
    - pain in my chest like a knife
    - chest pain going to my left arm
    - chest pain going into my jaw
    - pain in my chest and my arm feels funny
    - sudden pain in my chest and cold sweat
    - I broke into a cold sweat and feel like collapsing
    stroke:
    - my face is drooping on one side
    - one side of my face has drooped
    - my words are coming out slurred
    - my speech is slurred
    - my speech has gone funny
    - one side of my body has gone weak and numb
    - sudden weakness on one side of my body
    - the worst headache of my life
    - a sudden thunderclap headache
    breathing_distress:
    - finding it very hard to breathe
    - I can't catch my breath
    - cannot catch my breath
    - I am gasping for air
    - struggling to breathe
    - so breathless I cannot finish a sentence
    - cannot speak a full sentence
    - my lips have turned blue
    - my nails and lips have turned bluish
    - I turned blue
    anaphylaxis:
    - my lips are swelling and my throat is closing
    - my throat feels like it is closing
    - my tongue is swelling up
    - my face and tongue are swelling
    - my whole body has come out in hives
    - hives spreading fast over my body
    - a rash all over my body
    - rash spreading over my whole body after medicine
    - severe swelling of my mouth and throat
    reduced_consciousness:
