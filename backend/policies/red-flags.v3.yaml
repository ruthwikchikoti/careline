    - low sugar episode with sweating and trembling
    - I feel shaky sweaty and confused from low sugar
    hyperglycaemia_dka:
    - my sugar is very high and I keep vomiting
    - my sugar reading is very high and I am being sick
    - sugar above 350 and vomiting
    - breath smells fruity and sugar very high
    severe_asthma:
    - my reliever inhaler is not helping at all
    - the inhaler is not helping my breathing
    - wheezing very badly
    - wheezing that keeps getting worse
    - I used the inhaler six times in two hours
    - using the reliever again and again with no relief
    - my chest has completely locked up
    post_op_wound:
    - my incision has opened up
    - the surgical wound has opened
    - pus is coming out of my wound
    - the wound is oozing pus
