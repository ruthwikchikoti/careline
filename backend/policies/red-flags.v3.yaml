    acute_neuro:
    - the room is spinning and I cannot stand up
    - severe dizziness and I cannot stand
    - I am seeing things that are not there
    - sudden confusion and I don't know where I am
    - double vision that started suddenly
    dvt_swelling:
    - my calf is swollen and painful
    - one leg is swollen and painful after a flight
    - both ankles have swollen up hugely
    - sudden severe swelling of my ankles
    cardiac_signs:
    - my heart is racing so fast
    - my heart feels like it will jump out
    - palpitations that will not stop
    - I feel my heart pounding irregularly
    severe_undifferentiated:
    - sudden terrible pain and I am drenched in sweat
    - the pain is unbearable tonight
    - severe pain that is getting worse by the minute
    - I feel very unwell after taking medicine that was not mine
    - I feel very unwell after taking someone else's tablets
    - I mixed my medicine with someone else's tablets and feel very unwell
    - I feel extremely unwell right now
    joint_redness_sepsis:
    - my knee has become hot and red
    - the joint is hot red and extremely painful
    - red streaks spreading from my wound
context:
  history_suppressible_concepts:
  - cardiac_signs
  - chest_pain_cardiac
  - dvt_swelling
  - head_injury
  - joint_redness_sepsis
  - reduced_consciousness
  - seizure
  - severe_undifferentiated
  - stroke
  history_suppressible_regex_concepts:
  - cardiac_signs
  - chest_pain_cardiac
  - head_injury
  - reduced_consciousness
  - seizure
  - stroke
  acute_concern:
    note: first-person + acute-distress term + no definitional/history context -> escalate before any
      redirect (wired in gates/chain.py)
    term_patterns:
      bleeding: \bbleed(?:ing|s)?\b|\bblood\s+in\s+(?:my\s+)?(?:vomit|stool|urine|phlegm|sputum)
      breathing_distress: \bbreathless\w*|\bcannot\s+breathe|\bcan'?t\s+breathe|\bunable\s+to\s+breathe|\bshortness\s+of\s+breath|\bbreath\s+(?:keeps?\s+)?(?:stopping|getting\s+(?:hard|worse|difficult)|is\s+short)
      chest: \bchest\b
      collapse: \bcollapse[ds]?\b|\bfaint(?:ed|ing|s)?\b|\bpassed?\s+out\b|\bblacking\s+out\b|\bblackouts?\b
      dizzy: \bdizzy\w*|\bdizziness\b|\broom\s+is\s+spinning\b|\bspinning\s+head\b
      vomiting: \bvomit\w*|\bthrowing\s+up\b|\bbeing\s+sick\b|\bthrew\s+up\b
      seizure: \bseizure\w*|\bconvulsion\w*|\bfitting\b|\bjerking\b
      reduced_consciousness: \bunconscious\b|\bunresponsive\b|\bnot\s+responding\b|\bcannot\s+be\s+woken\b|\bcan'?t\s+(?:be\s+)?woken?\b|\bwon'?t\s+wake\b|\bcouldn'?t\s+be\s+woken\b|\bcan'?t\s+wake\s+(?:him|her|them)\b|\bkeep\s+my\s+eyes\s+open\b
      neuro_focal: \bnumb\w*|\bslurr\w*|\bweak\w*\s+(?:all\s+over|one\s+side|down\s+one)\b|\bdrooping\b|\bdroop\b|\bone\s+side\b.{0,30}\b(?:weak|numb|droop)
      rash_swelling: \brash\w*|\bswelling\b|\bswollen\b|\bhives\b|\bcoming\s+out\s+in\b
      fever: \bfever\w*|\bburning\s+up\b|\bboiling\b
      hypoglycaemia: \bsugar\s+(?:has\s+|keeps\s+|is\s+|was\s+)?(?:dropped|dropping|low)\b|\bglucose\s+(?:has\s+|is\s+)?(?:dropped|low)\b|\bhypo\b|\bsugar\s+is\s+(?:[23]\d|4\d)\b
      tremor: \btrembl\w*|\bshak(?:ing|es)\b|\bshivering\s+uncontrollably\b
      gi_bleed: \bblack\s+(?:stool|tarry)\b|\btarry\s+stool\b|\bblack\s+like\s+tar\b|\bcoffee[\s-]ground
      head_injury: \bhit\s+my\s+head\b|\bfell\s+(?:down|on)\b|\bfallen\b|\bfell\s+and\b|\b(?:splitting|worst|severe|sudden|thunderclap)\s+headache
      poisoning: \bkerosene\b|\bbleach\b|\bpesticide\b|\bweed\s?-?killer\b|\bcleaning\s+liquid\b|\bpoison\w*|\boverdosed?\b|\bketone\w*\s*(?:strips?|test)?\s*(?:is|are|show\w*)?\s*high|\bnail\s+polish\s+remover|\bfruity\s+breath
      cyanosis: \b(?:turned|turning|is|look\w*)\s+(?:blue|bluish|grey|gray)\b
      wrong_medication: \btook\b.{0,40}\binstead\s+of\s+(?:my|mine)\b|\bby\s+mistake\b|\bwrong\s+(?:tablet|medicine|dose|bottle)\b
      bp_crisis: \b(?:1[7-9]\d|2\d\d)\s*(?:over|/)\s*1[0-4]\d\b
