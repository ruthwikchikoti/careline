    - my family cannot wake me
    - nobody can wake me up
    - I keep blacking out
    - I have been blacking out repeatedly
    - I fainted
    - I passed out
    - I collapsed
    - I was unresponsive
    - I feel like I might collapse
    - I am very drowsy and confused
    seizure:
    - I keep fitting
    - I am having fits
    - jerking uncontrollably
    - my limbs are jerking and I cannot control them
    - was jerking in my sleep
    - I had a seizure
    - I had a convulsion
    choking:
    - I cannot stop choking
    - something went down the wrong way and I am choking
    - food is stuck and I cannot breathe
    - I am choking
    uncontrolled_bleeding:
    - the wound will not stop bleeding
    - I cannot stop the bleeding
    - blood is soaking through the dressing
    - bleeding heavily and it will not stop
    - I am coughing up blood
    - there is blood when I vomit
    - I vomited blood
    - I have cut myself deeply
    - a deep cut that is bleeding a lot
    head_injury:
    - I hit my head badly
    - I fell and hit my head
    - I fell down the stairs and hurt my head
    - a heavy blow to my head
    hypoglycaemia:
    - my sugar is very low and I am shaking and sweating
    - my sugar is 42 and I am shaking
