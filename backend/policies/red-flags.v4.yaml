version: v4
description: 'Emergency rail policy. v4 = v3 + round-1 adversarial-review fixes (2026-10-08): (1) the
  acute-concern net and the red-flag rail run pre-LLM on EVERY question (Brain and graph share one triage
  function) and the scope gate re-checks both for every scope, so an emergency mixed into an in-scope/administrative
  question can no longer be answered; (2) history/hypothetical/denial context is clause-scoped, never
  suppresses a present-tense clause, drops the bare ''at NN'' age marker, and a denial removes only the
  denied phrase; (3) structural patterns for ideation families, ''not breathing'', ingestion counts /
  whole packs, child ingestion of non-food, airway swelling, chest tightness, blood from gut/lungs, wound
  bleeding/dehiscence, fever + confusion, rigid abdomen, sudden neuro deficit, reduced fetal movement,
  cyanosis, transliterated Hindi/Hinglish terms; (4) typo normalisation for the highest-risk tokens. Pinned
  by tests/brain/test_review_round1.py (post-fix regression probes, not independent generalisation evidence).'
