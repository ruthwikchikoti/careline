context:
  scope: 'clause-scoped: split at [.;!?], before but/however/although/though/whereas/except, and before
    a fresh ''now''; a clause is suppressed only if it carries a history/hypothetical (or, for the acute
    net, definitional) marker AND no present marker'
  history_suppressible_concepts:
  - cardiac_signs
  - chest_pain_cardiac
  - dvt_swelling
  - head_injury
  - joint_redness_sepsis
  - reduced_consciousness
  - seizure
  - severe_undifferentiated
  - stroke
  history_suppressible_regex_concepts:
  - cardiac_signs
  - chest_pain_cardiac
  - head_injury
  - reduced_consciousness
  - seizure
  - stroke
  denial_regex_concepts:
  - ideation
  - self_harm
  - suicid
  history_markers:
  - last\s+year
  - last\s+month
  - years?\s+ago
  - a\s+year\s+ago
  - \bhistory\b
  - family\s+history
  - runs\s+in\s+the\s+family
  - grandfather
  - grandmother
  - my\s+(?:father|mother|dad|mom|brother|sister|wife|husband|uncle|aunt)\s+(?:had|has\s+had|had\s+a|died)\b
  - during\s+the\s+(?:operation|surgery|procedure)
  - when\s+they\s+took\s+my\b
  - last\s+time\b
  - \bused\s+to\b
  - injury\s+questions
  - \bat\s+(?:the\s+)?age\s+(?:of\s+)?\d{1,3}\b
  - \bwhen\s+i\s+was\s+(?:\d{1,3}|a\s+(?:kid|child|baby|teenager|boy|girl))\b
  - \bin\s+the\s+past\b
  - \bas\s+a\s+(?:kid|child|baby|teenager)\b
  - nearly\s+(?:fainted?|collapsed|passed\s+out)
  - almost\s+(?:fainted?|collapsed|passed\s+out)
  hypothetical_markers:
  - \b(?:if|when|whenever|in\s+case|should)\s+(?:i|my\s+\w+|he|she|they)\s+(?:ever\s+)?(?:feel|feels|get|gets|have|has|develop\w*|start\w*|notice\w*|become\w*|experience\w*)\b
  - \bif\s+i\s+ever\b
  - \bwhat\s+if\b
  present_markers:
  - \b(?:right\s+)?now\b
  - \btoday\b
  - \btonight\b
  - \bcurrently\b
  - \bat\s+the\s+moment\b
  - \bthis\s+(?:morning|afternoon|evening)\b
  - \bsince\s+(?:yesterday|last\s+night|this\s+morning|morning|an?\s+hour|\d+)
  - \bcan'?t\s+stop\b
  - \bi\s+(?:have|feel|keep)\b(?!\s+(?:had\b|been\b|(?:a\s+|an\s+)?(?:family\s+)?history\b|no\b|never\b))
  - \bi'?ve\s+got\b
  - \b(?:i'?m|i\s+am|he'?s|he\s+is|she'?s|she\s+is|it'?s|it\s+is|they'?re|they\s+are)\s+(?:having|getting|feeling|bleeding|vomiting|shaking|fitting|seizing|choking|struggling|gasping|wheezing|losing|going|turning|not\s+breathing)\b
  - \b(?:going|gone|turning)\s+(?:blue|grey|gray|purple)\b
  denial_markers:
  - \b(?:not|never)\s+(?:feeling\s+)?suicidal\b
  - \b(?:do(?:n'?t|\s+not)|did(?:n'?t|\s+not)|would\s+never|will\s+never|won'?t|never)\s+(?:(?:want|plan|intend|going)\s+to\s+)?(?:end|kill|harm|hurt)\s+(?:my\s*self|my\s+(?:own\s+)?life|it\s+all)\b
  - \bdo(?:n'?t|\s+not)\s+want\s+to\s+(?:die|be\s+dead)\b
  - \bnot\s+going\s+to\s+(?:hurt|kill|end|harm)\s+(?:my\s*self|my\s+(?:own\s+)?life|it\s+all)\b
  - \bno\s+(?:plans?|intention|thoughts?)\s+(?:to|of)\s+(?:harm\w*|end\w*|kill\w*|hurt\w*)\s+(?:my\s*self|my\s+(?:own\s+)?life|it\s+all)\b
  - \b(?:not|never)\s+(?:self[- ]?harm\w*|harm(?:ed|ing)?\s+my\s*self)\b
  acute_concern:
    note: first-person + acute-distress term in a live (non-suppressed) clause -> escalate; v4 runs it
      pre-LLM on every question (domain/brain/triage.py) and re-checks it in the scope gate for every
      scope (gates/chain.py)
